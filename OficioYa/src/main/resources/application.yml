spring:
  application:
    name: oficioya
  servlet:
    multipart:
      enabled: false
      max-file-size: 5MB
      max-request-size: 20MB

server:
  port: ${PORT:8081}

users:
  service:
    url: ${USERS_SERVICE_URL:http://localhost:8080}

images:
  service:
    url: ${IMAGES_SERVICE_URL:http://localhost:8083}

workers:
  service:
    url: ${WORKERS_SERVICE_URL:https://oficioya-worker-api.azurewebsites.net}

search:
  service:
    url: ${SEARCH_SERVICE_URL:https://oficioya-search-atgjh5gdfcb5b8h3.mexicocentral-01.azurewebsites.net}

reputation:
  service:
    url: ${REPUTATION_SERVICE_URL:https://oficioya-reputation-bggabfhkdvaqh4bw.mexicocentral-01.azurewebsites.net}

reporting:
  service:
    url: ${REPORTING_SERVICE_URL:https://oficioya-reporting-hvehegasb3hrarc9.mexicocentral-01.azurewebsites.net}

services:
  service:
    url: ${SERVICES_SERVICE_URL:https://oficioya-service-jj.azurewebsites.net}

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:https://oficioya-notif-jj.azurewebsites.net}

identity:
  service:
    # Puerto provisional: se define al desplegar todos los servicios.
    url: ${IDENTITY_SERVICE_URL:http://localhost:8085}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    eci.edu.dosw: INFO

jwt:
  # Mismo secreto (Base64, minimo 32 bytes) que usan Identity y Users.
  # Sin valor por defecto: si falta JWT_SECRET la app no arranca (falla rapido).
  # En desarrollo local el secreto sale de application-local.yml.
  secret: ${JWT_SECRET}